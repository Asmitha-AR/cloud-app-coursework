services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: identity_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── .NET API Services ──────────────────────────────────────────────────────
  identity-service:
    build:
      context: ./IdentityService.Api      # folder with the Dockerfile
      dockerfile: Dockerfile
    container_name: identity_service
    ports:
      - "5001:8080"                        # host:container
    environment:
      # Override the connection string so it points to the postgres container
      # (inside Docker, use the service name "postgres", not "localhost")
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=identity_db;Username=admin;Password=password
    depends_on:
      postgres:
        condition: service_healthy         # wait until postgres is ready

  salary-service:
    build:
      context: ./SalaryService.Api
      dockerfile: Dockerfile
    container_name: salary_service
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=identity_db;Username=admin;Password=password
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: ./SearchService.Api
      dockerfile: Dockerfile
    container_name: search_service
    ports:
      - "5003:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=identity_db;Username=admin;Password=password
    depends_on:
      postgres:
        condition: service_healthy

  stats-service:
    build:
      context: ./StatsService.Api
      dockerfile: Dockerfile
    container_name: stats_service
    ports:
      - "5004:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=identity_db;Username=admin;Password=password
    depends_on:
      postgres:
        condition: service_healthy

  vote-service:
    build:
      context: ./VoteService.Api
      dockerfile: Dockerfile
    container_name: vote_service
    ports:
      - "5005:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=identity_db;Username=admin;Password=password
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web_frontend
    ports:
      - "3000:3000"
    depends_on:
      - identity-service
      - salary-service
      - search-service
      - stats-service
      - vote-service

volumes:
  postgres_data:
