services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: identity_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── .NET API Services ──────────────────────────────────────────────────────
  identity-service:
    build:
      context: ./IdentityService.Api      # folder with the Dockerfile
      dockerfile: Dockerfile
    container_name: identity_service
    ports:
      - "5001:8080"                        # host:container
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      postgres:
        condition: service_healthy         # wait until postgres is ready

  salary-service:
    build:
      context: ./SalaryService.Api
      dockerfile: Dockerfile
    container_name: salary_service
    ports:
      - "5002:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: ./SearchService.Api
      dockerfile: Dockerfile
    container_name: search_service
    ports:
      - "5003:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      postgres:
        condition: service_healthy

  stats-service:
    build:
      context: ./StatsService.Api
      dockerfile: Dockerfile
    container_name: stats_service
    ports:
      - "5004:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      postgres:
        condition: service_healthy

  vote-service:
    build:
      context: ./VoteService.Api
      dockerfile: Dockerfile
    container_name: vote_service
    ports:
      - "5005:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=identity_db
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Build-time arguments for NEXT_PUBLIC_* variables
        NEXT_PUBLIC_AUTH_API_URL: http://localhost:5001/api
        NEXT_PUBLIC_SALARY_API_URL: http://localhost:5002/api
        NEXT_PUBLIC_STATS_API_URL: http://localhost:5004/api
        NEXT_PUBLIC_VOTE_API_PROXY_PATH: /api/vote
        NEXT_PUBLIC_SEARCH_API_PROXY_PATH: /api/search
    container_name: web_frontend
    ports:
      - "3000:3000"
    environment:
      # Client-side API endpoints (browser makes these calls to host machine)
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:5001/api
      - NEXT_PUBLIC_SALARY_API_URL=http://localhost:5002/api
      - NEXT_PUBLIC_STATS_API_URL=http://localhost:5004/api
      - NEXT_PUBLIC_VOTE_API_PROXY_PATH=/api/vote
      - NEXT_PUBLIC_SEARCH_API_PROXY_PATH=/api/search
      # Server-side proxy targets (Next.js server calls these - use Docker service names)
      - VOTE_API_BASE_URL=http://vote-service:8080/api
      - SEARCH_API_BASE_URL=http://search-service:8080/api
    depends_on:
      - identity-service
      - salary-service
      - search-service
      - stats-service
      - vote-service

volumes:
  postgres_data:
