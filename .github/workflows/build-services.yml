name: Build & Push All Services

on:
  push:
    branches: [main]

jobs:

  build-voteservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push VoteService
        uses: docker/build-push-action@v4
        with:
          context: ./VoteService.Api
          push: true
          tags: kithusshand/voteservice:latest

  build-statsservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push StatsService
        uses: docker/build-push-action@v4
        with:
          context: ./StatsService.Api
          push: true
          tags: kithusshand/statsservice:latest

  build-searchservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push SearchService
        uses: docker/build-push-action@v4
        with:
          context: ./SearchService.Api
          push: true
          tags: kithusshand/searchservice:latest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: kithusshand/frontend:latest
          build-args: |
            NEXT_PUBLIC_AUTH_API_URL=http://74.224.97.56/api
            NEXT_PUBLIC_SALARY_API_URL=http://74.224.97.56/api
            NEXT_PUBLIC_VOTE_API_PROXY_PATH=/api/vote
            NEXT_PUBLIC_SEARCH_API_PROXY_PATH=/api/search
            NEXT_PUBLIC_STATS_API_URL=http://74.224.97.56/api
