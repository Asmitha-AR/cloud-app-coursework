name: Build & Push Frontend

on:
  push:
    branches:
      - production_Lavaniyah
    paths:
      - 'web/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_AUTH_API_URL=http://74.224.97.56/api
            NEXT_PUBLIC_SALARY_API_URL=http://74.224.97.56/api
            NEXT_PUBLIC_VOTE_API_PROXY_PATH=/api/vote
            NEXT_PUBLIC_SEARCH_API_PROXY_PATH=/api/search
            NEXT_PUBLIC_STATS_API_URL=http://74.224.97.56/api
