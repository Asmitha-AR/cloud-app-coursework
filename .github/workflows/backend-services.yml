name: Build & Push Backend Services

on:
  push:
    branches:
      - production_Lavaniyah
    paths:
      - 'IdentityService.Api/**'
      - 'SalaryService.Api/**'
      - 'VoteService.Api/**'
      - 'StatsService.Api/**'
      - 'SearchService.Api/**'

jobs:
  build-identityservice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_LAVANIYAH }}
          password: ${{ secrets.DOCKER_PASSWORD_LAVANIYAH }}

      - name: Build and Push IdentityService
        uses: docker/build-push-action@v5
        with:
          context: ./IdentityService.Api
          file: ./IdentityService.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME_LAVANIYAH }}/identityservice:latest
            ${{ secrets.DOCKER_USERNAME_LAVANIYAH }}/identityservice:${{ github.sha }}

  build-salaryservice:
