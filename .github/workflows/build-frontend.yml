name: Build & Push Frontend

on:
  push:
    branches: [production_live_test]
    paths:
      - 'web/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: kithusshand/frontend:latest
          build-args: |
            NEXT_PUBLIC_AUTH_API_URL=http://74.224.97.56/api
            NEXT_PUBLIC_SALARY_API_URL=http://74.224.97.56/api
            NEXT_PUBLIC_STATS_API_URL=http://74.224.97.56/api
            NEXT_PUBLIC_VOTE_API_PROXY_PATH=/api
            NEXT_PUBLIC_SEARCH_API_PROXY_PATH=/api
