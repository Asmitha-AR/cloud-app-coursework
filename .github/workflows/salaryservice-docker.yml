name: SalaryService Docker Build & Push

on:
  push:
    branches:
      - production_live
    paths:
      - 'SalaryService.Api/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push SalaryService Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./SalaryService.Api/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/salaryservice:latest
          ${{ secrets.DOCKER_USERNAME }}/salaryservice:${{ github.sha }}
