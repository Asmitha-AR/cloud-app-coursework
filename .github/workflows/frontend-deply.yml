name: Frontend Docker Build & Push

on:
  push:
    branches:
      - production_pravini
    paths:
      - "web/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_PRAVINI }}
          password: ${{ secrets.DOCKER_PASSWORD_PRAVINI }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          dockerfile: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME_PRAVINI }}/frontend:latest
            ${{ secrets.DOCKER_USERNAME_PRAVINI }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_AUTH_API_URL=http://20.205.144.161/api
            NEXT_PUBLIC_SALARY_API_URL=http://20.205.144.161/api
            NEXT_PUBLIC_VOTE_API_PROXY_PATH=http://20.205.144.161/api
            NEXT_PUBLIC_SEARCH_API_PROXY_PATH=http://20.205.144.161/api
            NEXT_PUBLIC_STATS_API_URL=http://20.205.144.161/api
            