# identity.yaml
# Deploy the identityservice API and expose it to the internet

apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identityservice
  template:
    metadata:
      labels:
        app: identityservice
    spec:
      containers:
        - name: identityservice
          image: kithusshand/identityservice
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password123
            - name: DB_NAME
              value: mydb

---
# Expose identityservice to the internet using LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: identityservice
spec:
  type: LoadBalancer   # 👈 IMPORTANT CHANGE
  selector:
    app: identityservice
  ports:
    - port: 80
      targetPort: 8080
