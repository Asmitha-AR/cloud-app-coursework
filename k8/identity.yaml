apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityservice
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identityservice
  template:
    metadata:
      labels:
        app: identityservice
    spec:
      containers:
        - name: identityservice
          image: it21176210/identityservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5100
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres.data.svc.cluster.local;Database=identity_db;Username=admin;Password=password123
---
apiVersion: v1
kind: Service
metadata:
  name: identityservice
  namespace: app
spec:
  selector:
    app: identityservice
  ports:
    - port: 80
      targetPort: 5100
