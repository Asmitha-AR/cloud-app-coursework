apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: pavk230/identityservice:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: app
spec:
  selector:
    app: identity
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP