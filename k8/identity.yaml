apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identityservice
  template:
    metadata:
      labels:
        app: identityservice
    spec:
      containers:
        - name: identityservice
          image: kithusshand/identityservice
          ports:
            - containerPort: 5100
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5100
            - name: DB_HOST
              value: postgres.default.svc.cluster.local
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password123
            - name: DB_NAME
              value: mydb

---
apiVersion: v1
kind: Service
metadata:
  name: identityservice
spec:
  type: LoadBalancer
  selector:
    app: identityservice
  ports:
    - port: 80
      targetPort: 5100
