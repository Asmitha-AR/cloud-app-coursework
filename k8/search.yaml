apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchservice
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchservice
  template:
    metadata:
      labels:
        app: searchservice
    spec:
      containers:
        - name: searchservice
          image: it21176210/searchservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5020
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres.data.svc.cluster.local;Database=paymentappdb;Username=admin;Password=password123
---
apiVersion: v1
kind: Service
metadata:
  name: searchservice
  namespace: app
spec:
  selector:
    app: searchservice
  ports:
    - port: 80
      targetPort: 5020
