apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: pavk230/searchservice:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: app
spec:
  selector:
    app: search
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP