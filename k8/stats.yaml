apiVersion: apps/v1
kind: Deployment
metadata:
  name: statsservice
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statsservice
  template:
    metadata:
      labels:
        app: statsservice
    spec:
      containers:
        - name: statsservice
          image: it21176210/statsservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5019
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres.data.svc.cluster.local;Database=paymentappdb;Username=admin;Password=password123
---
apiVersion: v1
kind: Service
metadata:
  name: statsservice
  namespace: app
spec:
  selector:
    app: statsservice
  ports:
    - port: 80
      targetPort: 5019
