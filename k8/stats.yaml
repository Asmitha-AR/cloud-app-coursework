apiVersion: apps/v1
kind: Deployment
metadata:
  name: statsservice
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statsservice
  template:
    metadata:
      labels:
        app: statsservice
    spec:
      containers:
        - name: statsservice
          image: lavaniyah/statsservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres.data.svc.cluster.local
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password123
            - name: DB_NAME
              value: identity_db
---
apiVersion: v1
kind: Service
metadata:
  name: statsservice
  namespace: app
spec:
  selector:
    app: statsservice
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
