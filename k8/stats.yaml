apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats
  template:
    metadata:
      labels:
        app: stats
    spec:
      containers:
        - name: stats
          image: pavk230/statsservice:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: stats
  namespace: app
spec:
  selector:
    app: stats
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP