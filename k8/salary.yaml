apiVersion: apps/v1
kind: Deployment
metadata:
  name: salaryservice
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salaryservice
  template:
    metadata:
      labels:
        app: salaryservice
    spec:
      containers:
        - name: salaryservice
          image: pavk230/salaryservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres.data.svc.cluster.local;Database=paymentappdb;Username=admin;Password=password123
---
apiVersion: v1
kind: Service
metadata:
  name: salaryservice
  namespace: app
spec:
  selector:
    app: salaryservice
  ports:
    - port: 80
      targetPort: 5001