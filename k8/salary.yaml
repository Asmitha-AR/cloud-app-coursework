# salary.yaml (FINAL CORRECT VERSION)

apiVersion: batch/v1
kind: Job
metadata:
  name: salaryservice
  namespace: app
spec:
  template:
    spec:
      containers:
        - name: salaryservice
          image: kithusshand/salaryservice
          env:
            - name: DB_HOST
              value: postgres.data.svc.cluster.local
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password123
            - name: DB_NAME
              value: paymentappdb
      restartPolicy: Never
