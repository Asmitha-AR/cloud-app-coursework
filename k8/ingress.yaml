apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app          # ✅ FIX: must be same namespace as backend services
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx  # ✅ FIX: replaces deprecated kubernetes.io/ingress.class annotation
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: identityservice
                port:
                  number: 80
          - path: /api/salary
            pathType: Prefix
            backend:
              service:
                name: salaryservice
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
