apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80

          - path: /api/salaries
            pathType: Prefix
            backend:
              service:
                name: salary
                port:
                  number: 80

          - path: /api/votes
            pathType: Prefix
            backend:
              service:
                name: vote
                port:
                  number: 80

          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: search
                port:
                  number: 80

          - path: /api/stats
            pathType: Prefix
            backend:
              service:
                name: stats
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80