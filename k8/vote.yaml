apiVersion: apps/v1
kind: Deployment
metadata:
  name: voteservice
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voteservice
  template:
    metadata:
      labels:
        app: voteservice
    spec:
      containers:
        - name: voteservice
          image: it21176210/voteservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres.data.svc.cluster.local;Database=paymentappdb;Username=admin;Password=password123
---
apiVersion: v1
kind: Service
metadata:
  name: voteservice
  namespace: app
spec:
  selector:
    app: voteservice
  ports:
    - port: 80
      targetPort: 5002
