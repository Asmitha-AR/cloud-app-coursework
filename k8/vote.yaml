apiVersion: apps/v1
kind: Deployment
metadata:
  name: voteservice
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voteservice
  template:
    metadata:
      labels:
        app: voteservice
    spec:
      containers:
        - name: voteservice
          image: kithusshand/voteservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres.data.svc.cluster.local
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password123
            - name: DB_NAME
              value: paymentappdb
---
apiVersion: v1
kind: Service
metadata:
  name: voteservice
  namespace: app
spec:
  selector:
    app: voteservice
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
